name: Zauber
description: Zauber is an AI agent platform purpose-built for sea and air freight forwarding
  operations. Freight forwarders describe their processes in plain language and Zauber's
  AI agents execute them consistently across global operations, automating rate and
  booking workflows with exception handling, deploying global workflows with local
  execution, and giving operators real-time operational visibility into conversion
  rates, response times, and exception patterns. The platform integrates with existing
  systems including Office 365, CargoWise One, carrier portals, and proprietary tooling.
  Zauber is a portfolio company of Point Nine. No public API, developer portal, or
  developer documentation is currently published; this profile captures the company's
  identity and security posture.
